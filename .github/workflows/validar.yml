name: Validar dados
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar PyYAML
        run: pip install pyyaml
      - name: Validar data/events.json
        run: python scripts/validar.py
      - name: Testes
        run: python -m unittest discover -s scripts -v
