name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Upload e deploy em jobs separados: no mesmo job o deploy às vezes
  # não acha o artefato recém-enviado (actions/deploy-pages#451).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Montar o site
        run: |
          mkdir -p _site/data
          cp index.html og.png favicon.svg config.json _site/
          cp data/events.json data/tags.json data/roles.json data/tags_roles.json data/roles_fixos.json _site/data/
      - name: Conferir arquivos que o index.html pede
        run: |
          set -e
          faltando=0
          # Caminhos literais em fetch/fetchJson: config.json e data/*.json
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ ! -f "_site/$path" ]; then
              echo "faltando em _site: $path"
              faltando=1
            else
              echo "ok: $path"
            fi
          done < <(grep -oE 'config\.json|data/[A-Za-z0-9_.-]+\.json' index.html | sort -u)
          if [ "$faltando" -ne 0 ]; then
            echo "O _site não tem todos os JSON que index.html pede."
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
